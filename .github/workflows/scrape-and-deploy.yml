name: Scrape and deploy

on:
  schedule:
    - cron: "0 22 * * *"        # 07:00 JST daily
  workflow_dispatch: {}          # manual run button
  push:
    branches: [main]
    paths: ["site/**", "src/**", "cli.py", ".github/workflows/**"]

concurrency:
  group: scrape-deploy
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # job-scoped permissions (R19/OPS-4): deploy needs none of these
    permissions:
      contents: write            # commit events.db + public.json
      issues: write              # rolling scraper-error/gap/stale issues
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests (fixture-based, offline)
        run: python -m pytest tests/ -q

      # Scheduled/manual runs scrape; push runs just redeploy the site.
      - name: Scrape all sources
        if: github.event_name != 'push'
        env:
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}   # repo variable, "true"/"false"
        run: |
          FLAGS="--report scrape_report.json"
          if [ "$AUTO_PUBLISH" = "true" ]; then FLAGS="$FLAGS --auto"; fi
          python cli.py scrape $FLAGS

      - name: Export public feed
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: LLM genre tagging
        run: python cli.py export site/public.json

      # The data files are pure outputs of this run — rebuild the data
      # commit on top of the current remote tip instead of rebasing
      # (binary events.db conflicts killed the 2026-07-26 run when a
      # manual push landed mid-scrape). See scripts/commit_data.sh.
      - name: Commit updated data back to repo
        if: github.event_name != 'push'
        run: |
          git config user.name "tokyo-events-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/commit_data.sh

      # !cancelled(): a failed data push must not suppress error
      # reporting (report_errors.py exits 0 when the report is missing,
      # so early failures stay safe).
      - name: File issue if any scraper errored
        if: ${{ !cancelled() && github.event_name != 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/report_errors.py scrape_report.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    permissions:
      pages: write               # deploy Pages
      id-token: write            # Pages OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
